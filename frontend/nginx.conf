server {
  listen 80;
  server_name _;

  # Gates the whole app (including the API) behind a single shared
  # credential, since the app's own login is a mocked identity picker with
  # no real password — this is the actual access control for a hosted demo.
  # The .htpasswd file is mounted in at deploy time, not baked into the
  # image; see docs/09-deployment.md.
  auth_basic "DocMe360 Demo";
  auth_basic_user_file /etc/nginx/.htpasswd;

  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
