services:
  postgres:
    image: postgres:16-alpine
    container_name: docme360-postgres
    environment:
      POSTGRES_USER: docme360
      POSTGRES_PASSWORD: docme360
      POSTGRES_DB: docme360
    ports:
      - "5432:5432"
    volumes:
      - docme360-postgres-data:/var/lib/postgresql/data

volumes:
  docme360-postgres-data:
